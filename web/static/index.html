<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cornerstone — Blokus Duo 试玩</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>cornerstone</h1>
  <span class="sub">Blokus Duo · 从零自博弈</span>
  <span class="spacer"></span>
  <span id="ai-name" class="badge">加载中…</span>
</header>

<main>
  <section class="board-col">
    <div class="board-wrap">
      <canvas id="board" width="700" height="700"></canvas>
    </div>
    <div id="status" class="status">正在开局…</div>
    <div id="lastmove" class="hint center"></div>
    <div class="scores">
      <div class="score p0"><span class="dot"></span><span class="label">先手</span><b id="score0">0</b></div>
      <div class="score p1"><span class="dot"></span><span class="label">后手</span><b id="score1">0</b></div>
      <div class="score"><span class="label">手数</span><b id="ply">0</b></div>
    </div>
  </section>

  <aside class="side-col">
    <div class="card">
      <div class="row">
        <label class="wide"><span class="seat p0"></span>先手（起点 5,5）
          <span class="withbtn">
            <select id="seat0"></select>
            <select id="sims0" class="sims" title="每步的 MCTS 模拟数"></select>
          </span>
        </label>
      </div>
      <div class="row">
        <label class="wide"><span class="seat p1"></span>后手（起点 10,10）
          <span class="withbtn">
            <select id="seat1"></select>
            <select id="sims1" class="sims" title="每步的 MCTS 模拟数"></select>
          </span>
        </label>
      </div>
      <div id="backend-hint" class="hint"></div>
      <div id="lock-hint" class="hint lock"></div>
      <!-- 图标按钮：title 同时给出中文名，图标本身不够自解释时靠悬停提示补上 -->
      <div class="row buttons">
        <button id="btn-new" class="icon primary" title="新对局" aria-label="新对局">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button id="btn-undo" class="icon" title="悔棋" aria-label="悔棋">
          <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10H9"/></svg>
        </button>
        <button id="btn-ai" class="icon" title="让 AI 走一步" aria-label="让 AI 走一步">
          <svg viewBox="0 0 24 24"><path d="M6 5l9 7-9 7z" class="fill"/><path d="M18 5v14"/></svg>
        </button>
        <button id="btn-autoplay" class="icon" title="自动对战" aria-label="自动对战">
          <svg viewBox="0 0 24 24" class="ico-play"><path d="M7 4l13 8-13 8z" class="fill"/></svg>
          <svg viewBox="0 0 24 24" class="ico-stop"><rect x="6" y="6" width="12" height="12" rx="1.5" class="fill"/></svg>
        </button>
      </div>
    </div>

    <!-- 棋子面板由 JS 按座位生成：有人在座摆一块，AI 对战摆两块（只读） -->
    <div id="pieces-wrap" class="pieces-wrap"></div>

    <div class="card" id="analysis-card">
      <h2>AI 判断</h2>
      <div class="winbar"><div id="winfill"></div><span id="wintext">—</span></div>
      <ol id="topmoves" class="topmoves"><li class="empty">让 AI 走一步后显示</li></ol>
    </div>
  </aside>
</main>

<script src="/static/app.js"></script>
</body>
</html>
