<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cornerstone — Blokus Duo 试玩</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="js-error" class="js-error gone"></div>
<header>
  <h1>cornerstone</h1>
  <span class="sub">Blokus Duo · 从零自博弈</span>
  <span class="spacer"></span>
  <span id="ai-name" class="badge">加载中…</span>
</header>

<main>
  <section class="board-col">
    <div class="board-wrap">
      <canvas id="board" width="700" height="700"></canvas>
    </div>
    <div id="status" class="status">正在开局…</div>
    <div id="lastmove" class="hint center"></div>
    <div class="scores">
      <div class="score p0"><span class="dot"></span><span class="label">先手</span><b id="score0">0</b></div>
      <div class="score p1"><span class="dot"></span><span class="label">后手</span><b id="score1">0</b></div>
      <div class="score"><span class="label">手数</span><b id="ply">0</b></div>
    </div>
  </section>

  <aside class="side-col">
    <div class="card">
      <div class="row">
        <label class="wide"><span class="seat p0"></span>先手（起点 5,5）
          <span class="withbtn">
            <select id="seat0"></select>
            <select id="sims0" class="sims" title="每步的 MCTS 模拟数"></select>
          </span>
        </label>
      </div>
      <div class="row">
        <label class="wide"><span class="seat p1"></span>后手（起点 10,10）
          <span class="withbtn">
            <select id="seat1"></select>
            <select id="sims1" class="sims" title="每步的 MCTS 模拟数"></select>
          </span>
        </label>
      </div>
      <div id="backend-hint" class="hint"></div>
      <div id="lock-hint" class="hint lock"></div>
      <!-- 纯图标按钮。每个按钮**只有一个** svg，图形由 JS 按状态换掉 ——
           原先是两个 svg 叠着、靠 CSS 显示其中一个，样式一旦没生效
           （比如浏览器用了旧 CSS）就会两个一起显示。少放一个进 DOM，
           这种坏法就不存在了。图标不自解释，靠 title 悬停提示补上。 -->
      <div class="row buttons">
        <button id="btn-start" class="icon primary" title="开始对局" aria-label="开始对局">
          <svg id="ico-start" viewBox="0 0 24 24"></svg>
        </button>
        <button id="btn-pause" class="icon gone" title="暂停" aria-label="暂停">
          <svg id="ico-pause" viewBox="0 0 24 24"></svg>
        </button>
      </div>
    </div>

    <!-- 棋子面板由 JS 按座位生成：有人在座摆一块，AI 对战摆两块（只读） -->
    <div id="pieces-wrap" class="pieces-wrap"></div>

    <div class="card" id="analysis-card">
      <h2>AI 判断</h2>
      <div class="winbar"><div id="winfill"></div><span id="wintext">—</span></div>
      <ol id="topmoves" class="topmoves"><li class="empty">让 AI 走一步后显示</li></ol>
    </div>
  </aside>
</main>

<script src="/static/app.js"></script>
</body>
</html>
